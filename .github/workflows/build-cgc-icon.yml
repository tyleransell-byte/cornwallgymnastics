name: Build padded CGC home icon
on:
  push:
    paths:
      - '.github/workflows/build-cgc-icon.yml'
      - 'public/cgg-logo.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create square icon without stretching
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          source=Image.open('public/cgg-logo.png').convert('RGBA')
          source.thumbnail((780,780),Image.Resampling.LANCZOS)
          canvas=Image.new('RGBA',(1024,1024),'white')
          canvas.alpha_composite(source,((1024-source.width)//2,(1024-source.height)//2))
          canvas.convert('RGB').save('public/cgc-home-icon.png',optimize=True)
          PY
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cgc-home-icon.png
          git diff --cached --quiet || (git commit -m "Generate proportional CGC home icon" && git push)
