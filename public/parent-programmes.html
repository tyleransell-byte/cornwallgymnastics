<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Approved classes · CGC Parent Portal</title><style>*{box-sizing:border-box}body{margin:0;background:#fdf9d7;color:#171717;font:16px/1.5 system-ui,sans-serif}header{background:#fe9f59;padding:20px max(20px,calc((100vw - 800px)/2));color:#fff}header a{color:#fff;font-weight:700;text-decoration:none}header h1{margin:12px 0 0;font-size:clamp(28px,5vw,36px)}main{max-width:800px;margin:26px auto;padding:0 18px 50px}.panel{background:white;border:1px solid #e4dec5;border-radius:18px;padding:24px;margin-bottom:18px}label{font-weight:750;display:block;margin-bottom:8px}select{width:100%;padding:14px;border:2px solid #171717;border-radius:12px;background:#fff;font:inherit}button{background:#fe9f59;border:2px solid #171717;border-radius:12px;padding:12px 18px;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.muted{color:#59554e;font-size:14px}.offer{padding:17px;background:#fffaf1;border:1px solid #eadcc7;border-radius:14px;margin:14px 0}.offer h3{margin:0 0 10px}.offer p{margin:6px 0}.total{font-size:22px;font-weight:800}.status{margin:14px 0}#details[hidden],#offer[hidden]{display:none!important}a{color:#87421e}</style></head><body><header><a href="/parent-portal.html">← Back to Parent Portal</a><h1>Approved classes</h1></header><main><section class="panel"><label for="child">Choose your child</label><select id="child" disabled><option value="">Loading your children…</option></select><p id="status" class="status" role="status"></p></section><section class="panel" id="details" hidden><h2 id="child-title">Classes</h2><div id="approved"></div><div id="offer" hidden><h3>Staff-approved class offer</h3><div id="offer-lines"></div><p id="total" class="total"></p><label for="payment">Choose payment method</label><select id="payment"><option value="recurring">Automatic monthly payment</option><option value="manual">Pay manually each month</option></select><p class="muted">For manual payments, we recommend paying between the 22nd and 28th. Cut-off: 29th (or the last day of shorter months).</p><button id="pay" type="button">Confirm &amp; Pay</button><p id="pay-status" role="status"></p><p class="muted">Stripe checkout is still being connected. No payment will be taken yet.</p></div></section></main><script src="/portal-client.js"></script><script>const $=id=>document.getElementById(id),url="https://dbolgmmyssfnuohpnmde.supabase.co/functions/v1/programme-requests";const names={recreational_4_7:"Recreational Gymnastics (4–7)",recreational_6_8:"Recreational Gymnastics (6–8)",recreational_6_12:"Recreational Gymnastics (6–12)",recreational_7_12:"Recreational Gymnastics (7–12)",recreational_plus:"Recreational Plus",development_wag:"Development WAG",novice_wag_junior:"Novice WAG Junior",novice_wag_senior:"Novice WAG Senior",wag_1:"WAG 1",wag_2:"WAG 2"};let children=[];async function api(action,extra={}){const session=await CgcPortal.session();if(!session)throw Error("Please sign in to your Parent Portal.");const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+session.access_token},body:JSON.stringify({action,child_id:$("child").value,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||"Unable to load classes");return d}async function load(){try{const data=await CgcPortal.api("dashboard");children=data.children||[];$("child").replaceChildren(new Option("Choose a child",""));for(const c of children)$("child").add(new Option(c.full_name,c.id));$("child").disabled=!children.length;$("status").textContent=children.length?"Select your child to view their approved classes.":"No children are linked to your account yet."}catch(e){$("status").textContent=e.message}}async function show(){const child=children.find(c=>c.id===$("child").value);$("details").hidden=!child;if(!child)return;$("child-title").textContent=child.full_name+"'s classes";$("approved").replaceChildren();$("offer").hidden=true;$("status").textContent="Loading approved classes…";try{const data=await api("parent_list");const offer=data.requests.find(r=>r.status==="offered"||r.status==="accepted");const pending=data.requests.find(r=>r.status==="requested");const eligibilityResponse=await fetch("https://dbolgmmyssfnuohpnmde.supabase.co/functions/v1/programme-enrolment",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+(await CgcPortal.session()).access_token},body:JSON.stringify({action:"eligibility",child_id:child.id})});const eligibility=eligibilityResponse.ok?await eligibilityResponse.json():{approved_programmes:[]};const staffApprovals=eligibility.approved_programmes||[];if(offer){$("offer").hidden=false;for(const code of offer.programme_codes){const p=document.createElement("p");p.textContent="✓ "+(names[code]||code);$("approved").append(p);const line=document.createElement("p");line.textContent=names[code]||code;$("offer-lines").append(line)}$("total").textContent="Total: £"+(offer.monthly_total_pence/100).toFixed(2)+" per month";$("pay").dataset.requestId=offer.id;$("status").textContent="These classes have been selected by staff."}else if(staffApprovals.length){for(const code of staffApprovals){const line=document.createElement("p");line.textContent="✓ "+(names[code]||code);$("approved").append(line)}$("status").textContent="These programmes have been approved by staff. A monthly class offer has not been sent yet."}else if(pending){$("approved").textContent="Staff have not approved any classes for this child yet.";$("status").textContent="No approved classes yet."}else{$("approved").textContent="No classes have been approved for this child yet.";$("status").textContent="Only classes approved by staff will appear here."}}catch(e){$("status").textContent=e.message}}$("child").onchange=()=>{$("offer-lines").replaceChildren();$("pay-status").textContent="";show()};$("pay").onclick=async()=>{const b=$("pay");b.disabled=true;try{await api("parent_accept",{request_id:b.dataset.requestId,payment_preference:$("payment").value});$("pay-status").textContent="Payment ready."}catch(e){$("pay-status").textContent=e.message;b.disabled=false}};load();</script></body></html>
