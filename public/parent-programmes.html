<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eligible programmes · CGC Parent Portal</title><style>body{font:16px/1.5 system-ui;margin:0;background:#fdf9d7;color:#171717}header{background:#fe9f59;padding:20px}main{max-width:850px;margin:24px auto;padding:0 18px}.panel{background:white;border:1px solid #e5ddc2;border-radius:14px;padding:22px;margin-bottom:16px}button{padding:12px 20px;background:#fe9f59;border:2px solid #171717;border-radius:30px;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}select{display:block;padding:12px;width:100%;max-width:440px;font:inherit;border-radius:8px;margin:8px 0 18px}.card{border-top:1px solid #ddd;padding:15px 0}.tag{font-weight:700;color:#255d65}a{color:#183b64}</style></head><body><header><a href="/parent-portal.html">← Parent Portal</a><h1>Programmes for your child</h1></header><main><div class="panel"><p>This page shows programmes your child can join based on age and staff invitations. <strong>Enrolment and monthly checkout are not enabled yet.</strong></p><button id="load">Load my children</button><label for="child">Child</label><select id="child" disabled><option value="">Choose a child</option></select><p id="message" role="status"></p></div><section class="panel" id="results" hidden><h2>Eligible programmes</h2><div id="programmes"></div></section></main><script src="/portal-client.js"></script><script type="module">import {PROGRAMMES,SESSIONS} from "/src/programmeCatalog.js";const $=id=>document.getElementById(id);const endpoint="https://dbolgmmyssfnuohpnmde.supabase.co/functions/v1/programme-enrolment";let children=[];const day={tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday"};function age(d){if(!d)return null;const dob=new Date(d+"T12:00:00Z");if(Number.isNaN(dob.valueOf()))return null;const now=new Date();let a=now.getUTCFullYear()-dob.getUTCFullYear();if(now.getUTCMonth()<dob.getUTCMonth()||(now.getUTCMonth()===dob.getUTCMonth()&&now.getUTCDate()<dob.getUTCDate()))a--;return a}async function eligible(childId){const session=await CgcPortal.session();if(!session)throw Error("Please sign in to your Parent Portal first.");const res=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+session.access_token},body:JSON.stringify({action:"eligibility",child_id:childId})});const data=await res.json();if(!res.ok)throw Error(data.error||"Eligibility check failed");return data}async function load(){try{$("message").textContent="Loading children…";const data=await CgcPortal.api("dashboard");children=data.children||[];$("child").replaceChildren(new Option("Choose a child",""));for(const child of children)$("child").add(new Option(child.full_name,child.id));$("child").disabled=!children.length;$("message").textContent=children.length?"Select your child to see available programmes.":"Add a child in your Parent Portal first."}catch(e){$("message").textContent=e.message}}async function show(){const id=$("child").value;$("results").hidden=true;if(!id)return;try{$("message").textContent="Checking staff approvals…";const data=await eligible(id);const a=age(data.child.date_of_birth);const eligibleCodes=Object.keys(PROGRAMMES).filter(code=>{const p=PROGRAMMES[code];return p.invitation?data.approved_programmes.includes(code):a!==null&&a>=p.ageMin&&a<=p.ageMax});const container=$("programmes");container.replaceChildren();if(!eligibleCodes.length){const p=document.createElement("p");p.textContent="No programmes are currently available for this child. Contact CGC if you think this is incorrect.";container.append(p)}for(const code of eligibleCodes){const p=PROGRAMMES[code];const card=document.createElement("article");card.className="card";const title=document.createElement("h3");title.textContent=p.label;const price=document.createElement("p");price.textContent="£"+(p.pricePence/100).toFixed(2)+" per month";const details=document.createElement("p");details.textContent=p.mode==="multi_day"?"Included weekly days: ":"Choose one weekly day from: ";details.textContent+=(SESSIONS[code]||[]).map(id=>day[id.split("-")[0]]).join(", ");const tag=document.createElement("p");tag.className="tag";tag.textContent=p.invitation?"Staff approved":"Age eligible";card.append(title,price,details,tag);container.append(card)}$("results").hidden=false;$("message").textContent="Eligibility checked. No bookings or payments have been made."}catch(e){$("message").textContent=e.message}}$("load").onclick=load;$("child").onchange=show;load();</script></body></html>
