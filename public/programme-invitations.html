<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CGC Programme Invitations</title><style>body{font:16px system-ui;background:#fff8e5;color:#202020;margin:0}header{background:#fe9f59;padding:20px}main{max-width:800px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:16px 0}button,select{font:inherit;padding:10px;border-radius:8px;margin:8px 0}button{background:#fe9f59;border:1px solid #222;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:10px 0}.status{min-height:24px}</style></head><body><header><a href="/staff-register.html">← Staff register</a><h1>Programme invitations</h1></header><main><p>Administrator-only approvals. An invitation lets a parent see an eligible programme; it does not book a place or take payment.</p><div class="panel"><button id="load">Load children</button><label>Child <select id="child" disabled><option>Select a child</option></select></label><div id="programmes"></div><p id="status" role="status" class="status"></p></div></main><script src="/portal-client.js"></script><script type="module">import {PROGRAMMES} from "/src/programmeCatalog.js";const $=id=>document.getElementById(id),codes=Object.keys(PROGRAMMES).filter(x=>PROGRAMMES[x].invitation);let busy=false;async function call(action,more={}){const session=await CgcPortal.session();if(!session?.access_token)throw Error("Sign in through the Staff Register first.");const response=await fetch("https://dbolgmmyssfnuohpnmde.supabase.co/functions/v1/programme-staff",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+session.access_token},body:JSON.stringify({action,...more})});const data=await response.json();if(!response.ok)throw Error(data.error||"Request failed");return data}const message=x=>$("status").textContent=x;async function load(){if(busy)return;busy=true;try{message("Loading…");const data=await call("children");$("child").replaceChildren(new Option("Choose a child",""));for(const child of data.children)$("child").add(new Option(child.full_name,child.id));$("child").disabled=false;message("Choose a child to manage invitations.")}catch(e){message(e.message)}finally{busy=false}}async function refresh(){const id=$("child").value;$("programmes").replaceChildren();if(!id)return;try{const data=await call("list",{child_id:id});for(const code of codes){const label=document.createElement("label");const check=document.createElement("input");check.type="checkbox";check.checked=data.approved_programmes.includes(code);label.append(check," "+PROGRAMMES[code].label);$("programmes").append(label);check.addEventListener("change",async()=>{check.disabled=true;try{await call(check.checked?"approve":"revoke",{child_id:id,programme_code:code});message("Invitation updated for "+PROGRAMMES[code].label)}catch(e){message(e.message);check.checked=!check.checked}finally{check.disabled=false}})}message("Tick to approve; untick to revoke.")}catch(e){message(e.message)}}$("load").onclick=load;$("child").onchange=refresh;</script></body></html>
